name: merge

on:
  schedule:
    # every 3 days at 02:00 UTC
    - cron: '0 1 */3 * *'
  workflow_dispatch:

concurrency:
  group: concurrent
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo with full history
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Git identity
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 3️⃣ Ensure main branch
      - name: Switch to main
        run: git checkout main

      # 4️⃣ Replace output folder with data branch version
      - name: Sync output from data
        run: |
          git fetch origin
          rm -rf output
          git checkout origin/data -- output

      # 5️⃣ Commit & push if changed
      - name: Commit and push
        run: |
          if git status --porcelain | grep .; then
            git add output
            git commit -m "chore: sync data updates to main"
            git push origin main
          else
            echo "No changes to sync"
          fi
