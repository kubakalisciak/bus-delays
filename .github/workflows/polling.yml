name: polling

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib pandas

      - name: create output folder
        run: mkdir -p output

      - name: backup old CSV if exists
        run: |
          if [ -f output/output.csv ]; then
            cp output/output.csv output/old.csv
          fi

      - name: run polling script
        run: python api.py

      - name: append new data to old CSV
        run: |
          python - <<EOF
          import pandas as pd
          import os

          new_file = "output/output.csv"
          old_file = "output/old.csv"

          if os.path.exists(old_file):
              df_old = pd.read_csv(old_file)
              df_new = pd.read_csv(new_file)
              df_combined = pd.concat([df_old, df_new], ignore_index=True)
              df_combined.to_csv(new_file, index=False)
          EOF

      - name: commit and push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/output.csv
          git commit -m "ACTIONS: Add new data [ci skip]" || echo "No changes to commit"
          git push
