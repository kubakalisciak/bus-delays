name: polling

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo bez domyślnego tokena
      - uses: actions/checkout@v3
        with:
          persist-credentials: false  # <- bardzo ważne, żeby nie używał starego tokena

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Instalacja pakietów
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib

      # 4️⃣ Utworzenie katalogu output
      - name: Create output folder
        run: mkdir -p output

      # 5️⃣ Uruchomienie skryptu
      - name: Run polling script
        run: python api.py

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v3
        with:
          name: data.csv
          path: output/output.csv
