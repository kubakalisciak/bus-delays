name: polling

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo bez domyślnego tokena
      - uses: actions/checkout@v3
        with:
          persist-credentials: false  # <- bardzo ważne, żeby nie używał starego tokena

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Instalacja pakietów
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Utworzenie katalogu output
      - name: Create output folder
        run: mkdir -p output

      # 5️⃣ Uruchomienie skryptu
      - name: Run polling script
        run: python api.py

      # 6️⃣ Commit i push CSV do branchu data z użyciem tokena
      - name: Commit CSV to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git fetch origin
          git checkout data || git checkout -b data
          git add output/output.csv
          git commit -m "Update output.csv" || echo "No changes to commit"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} data
