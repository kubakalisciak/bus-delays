name: fetch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure data branch exists
        run: |
          set -e
          git fetch origin

          if git show-ref --verify --quiet refs/remotes/origin/data; then
            echo "data branch exists"
          else
            echo "Creating data branch from main"
            git checkout -b data
            git push origin data
            git checkout main
          fi

      - name: Save current script and requirements from main
        run: |
          mkdir -p /tmp/script-cache
          cp api.py /tmp/script-cache/
          cp requirements.txt /tmp/script-cache/

      - name: Switch to data branch
        run: |
          git checkout data
          git pull --rebase origin data

      - name: Sync script and requirements onto data branch
        run: |
          cp /tmp/script-cache/api.py ./api.py
          cp /tmp/script-cache/requirements.txt ./requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run fetch script
        run: |
          mkdir -p output
          python api.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/*.csv api.py requirements.txt

          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "chore: pull data from external API"
            git push origin data
          fi