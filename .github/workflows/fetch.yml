name: fetch

on:
  schedule:
    - cron: '*/10 * * * *'  # runs every 10 minutes
  workflow_dispatch:  # allows manual trigger

concurrency:
  group: fetch-data
  cancel-in-progress: true  # prevents overlapping runs

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for force push

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate or append CSV
        id: generate_csv
        run: |
          # Dynamic filename based on current month
          CSV_FILE=$(python -c "from datetime import datetime; print('output/' + datetime.now().strftime('%Y-%m') + '.csv')")
          echo "CSV_FILE=$CSV_FILE" >> $GITHUB_ENV

          # Ensure output directory exists
          mkdir -p output

          # Run Python script — it handles appending internally
          python api.py

      - name: Commit and push to data branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch the data branch if it exists
          git fetch origin data || true

          # Switch to data branch or create it
          git switch data || git switch -c data

          # Recompute CSV_FILE if not set
          CSV_FILE="${CSV_FILE:-$(python -c "from datetime import datetime; print(\"output/\" + datetime.now().strftime('%Y-%m') + \".csv\")")}"

          # Ensure output directory exists
          mkdir -p output

          # Add CSV file
          git add "$CSV_FILE" || true

          # Commit only if changes exist
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "ACTIONS: append new bus delay data"
            git push --force-with-lease origin data
          fi
