name: fetch

on:
  schedule:
    - cron: '*/10 * * * *'  # runs every 10 minutes
  workflow_dispatch:  # allows manual trigger

concurrency:
  group: bus-delays-data
  cancel-in-progress: false

# Prevent overlapping cron runs
concurrency:
  group: fetch-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for force push

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # specify your desired Python version

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate CSV
        run: |
          python api.py

      - name: Commit and force push to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout data || git checkout -b data
          git add output/2025-12.csv
          git commit -m "ACTIONS: append data" || echo "Nothing to commit"

          # Force push to overwrite data branch safely
          git push --force-with-lease origin data
