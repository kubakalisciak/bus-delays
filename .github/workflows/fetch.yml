name: fetch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: fetch-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (main by default)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure data branch exists and switch to it
        run: |
          set -e

          git fetch origin
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet refs/remotes/origin/data; then
            echo "Data branch exists"
            git checkout data
          else
            echo "Creating data branch"
            git checkout --orphan data
            git rm -rf .
            git commit --allow-empty -m "Initialize data branch"
            git push origin data
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data fetch script
        run: |
          mkdir -p output
          python api.py

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/*.csv

          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "ACTIONS: append new data"
            git push origin data
          fi
