name: fetch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: concurrent
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout MAIN (workflow source)
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Ensure data branch exists (NORMAL branch, based on main)
      - name: Ensure data branch exists
        run: |
          set -e

          git fetch origin

          if git show-ref --verify --quiet refs/remotes/origin/data; then
            echo "data branch exists"
          else
            echo "Creating data branch from main"
            git checkout -b data
            git push origin data
            git checkout main
          fi

      # 3️⃣ Switch to data branch (work happens here)
      - name: Switch to data branch
        run: git checkout data

      # 4️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 5️⃣ Run script (appends data)
      - name: Run fetch script
        run: |
          mkdir -p output
          python api.py

      # 6️⃣ Commit and push ONLY data
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/*.csv

          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "ACTIONS: append new data"
            git push origin data
          fi
