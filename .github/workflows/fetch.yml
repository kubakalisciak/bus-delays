name: fetch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: create output folder
        run: mkdir -p output

      - name: backup old CSV if exists
        run: |
          if [ -f output/output.csv ]; then
            cp output/output.csv output/old.csv
          fi

      - name: run polling script
        run: python api.py

      - name: append new data
        run: |
          python - <<EOF
          import pandas as pd
          import os

          new_file = "output/output.csv"
          old_file = "output/old.csv"

          if os.path.exists(old_file):
              df_old = pd.read_csv(old_file)
              df_new = pd.read_csv(new_file)
              pd.concat([df_old, df_new], ignore_index=True) \
                .to_csv(new_file, index=False)
          EOF

      - name: deduplicate CSV
        run: |
          python - <<EOF
          import pandas as pd

          file = "output/output.csv"
          df = pd.read_csv(file)
          df.drop_duplicates(inplace=True)
          df.to_csv(file, index=False)
          EOF

      - name: create/update branch and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH="data"
          
          if git show-ref --verify --quiet refs/heads/$BRANCH; then
            git checkout $BRANCH
          else
            git checkout -b $BRANCH
          fi

          git add output/output.csv
          git commit -m "ACTIONS: update data [ci skip]" || echo "No changes"
          git push origin $BRANCH --force
