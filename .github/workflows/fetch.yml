name: fetch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib pandas

      - name: create output folder
        run: mkdir -p output

      - name: backup old CSV if exists
        run: |
          if [ -f output/output.csv ]; then
            cp output/output.csv output/old.csv
          fi

      - name: run polling script
        run: python api.py

      - name: append new data to old CSV
        run: |
          python - <<EOF
          import pandas as pd
          import os

          new_file = "output/output.csv"
          old_file = "output/old.csv"

          if os.path.exists(old_file):
              df_old = pd.read_csv(old_file)
              df_new = pd.read_csv(new_file)
              df_combined = pd.concat([df_old, df_new], ignore_index=True)
              df_combined.to_csv(new_file, index=False)
          EOF

      - name: commit and push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/output.csv
          git commit -m "ACTIONS: Add new data [ci skip]" || echo "Nothing to commit"
          git pull --rebase origin || echo "Nothing to rebase"
          git push origin main

  deduplicate:
      runs-on: ubuntu-latest
      needs: poll-data
  
      steps:
        - uses: actions/checkout@v3
          with:
            persist-credentials: true
  
        - name: set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.11'
  
        - name: remove duplicates in CSV
          run: |
            python - <<EOF
            import csv
            import os
            import tempfile
  
            file_path = "output/output.csv"
  
            if not os.path.exists(file_path):
                print("No CSV found, skipping.")
                exit(0)
  
            temp_fd, temp_path = tempfile.mkstemp(dir=os.path.dirname(file_path))
            seen = set()
  
            with open(file_path, 'r', newline='', encoding='utf-8') as infile, \
                 open(temp_path, 'w', newline='', encoding='utf-8') as outfile:
  
                reader = csv.DictReader(infile)
                fieldnames = reader.fieldnames
                writer = csv.DictWriter(outfile, fieldnames=fieldnames)
                writer.writeheader()
  
                for row in reader:
                    key = tuple(row[f] for f in fieldnames)
                    if key in seen:
                        print("Duplicate removed:", row)
                    else:
                        seen.add(key)
                        writer.writerow(row)
  
            os.close(temp_fd)
            os.replace(temp_path, file_path)
            EOF
  
        - name: commit and push cleaned CSV
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add output/output.csv
            git commit -m "ACTIONS: remove duplicates [ci skip]" || echo "No changes"
            git push origin main
